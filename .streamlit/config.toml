# Streamlit reads this file automatically at startup.
# It sets the app-wide theme so every built-in widget matches the dark navy design.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1426"
secondaryBackgroundColor = "#121F38"
textColor = "#E6ECF5"
font = "sans serif"

[server]
headless = true
